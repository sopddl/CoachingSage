<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CoachingSage AppIcon - Light variant
       Pattern : FAB Léon B-Sages (palette CoachingSage) — fond crème + halo or
       + disque bleu marine + coureur blanc dynamique au centre. -->

  <!-- Fond crème (1024×1024 plein) -->
  <rect width="1024" height="1024" fill="#F3EDE2"/>

  <!-- Halo doré (bordure) -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#D4A85A" stroke-width="44"/>

  <!-- Disque bleu marine -->
  <circle cx="512" cy="512" r="345" fill="#1E5090"/>

  <!-- Coureur dynamique (path Material Icons "directions_run" scalé) -->
  <g fill="#FFFFFF" transform="translate(512 512) scale(18) translate(-12 -12)">
    <!-- d= path SF-symbol-like figure.run (silhouette inclinée vers la droite) -->
    <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.89 19.38l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/>
  </g>
</svg>
