name: CoachingSage

options:
  bundleIdPrefix: com.sopddl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.45.0"
  # XcodeGen usage : bootstrap initial uniquement. Après génération,
  # le .xcodeproj est édité via Xcode comme GardenSage/TailorSage.
  # Si project.yml doit évoluer, rerun `xcodegen generate`.

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config-Debug.xcconfig
  Staging: Config-Staging.xcconfig
  Release: Config-Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: QLSTX2JJPF
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SageCore:
    url: https://github.com/sopddl/SageCore.git
    exactVersion: "1.3.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.43.0"
  Templates:
    path: Templates
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  CoachingSage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Repositories
      - path: Services
      - path: Utilities
      - path: Coaching
      - path: Resources
        buildPhase: resources
        excludes:
          # Archives de variantes brand (référence design) — ne pas embarquer
          # dans le bundle, sinon collision de noms avec les icônes courantes.
          - "Brand/_archive-*"
          # Scripts de génération d'assets (matplotlib) — pas pour le bundle.
          - "Brand/*.py"
    info:
      path: CoachingSage-Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - fr
          - en
        CFBundleURLTypes:
          - CFBundleURLName: com.sopddl.coachingsage.app
            CFBundleURLSchemes:
              - com.sopddl.coachingsage.app
              - coachingsage
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SUPABASE_HOST: $(SUPABASE_HOST)
        NSHealthShareUsageDescription: "CoachingSage utilise Apple Santé pour pré-remplir votre profil sportif (sexe, âge, poids, taille) et estimer votre niveau et fréquence d'activité depuis vos séances récentes. Vous pouvez aussi saisir ces informations manuellement à tout moment."
        # Requis par la validation App Store car l'API HealthKit d'autorisation (toShare:read:)
        # est référencée, même si l'app ne fait que LIRE (toShare: [] partout, cf HealthKitService).
        NSHealthUpdateUsageDescription: "CoachingSage lit vos séances et données de forme pour personnaliser vos programmes. L'app ne modifie pas vos données Apple Santé."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # App portrait uniquement : on opte hors du multitâche iPad (sinon l'App Store
        # exige les 4 orientations sur iPad, erreur 90474). Garde l'iPad installable (plein écran).
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        # Story 3.35 — la voix + les bips du mode Audio continuent quand l'app est
        # en arrière-plan / écran verrouillé (course téléphone en poche).
        UIBackgroundModes:
          - audio
    entitlements:
      path: CoachingSage.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.sopddl.coachingsage.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app
        PRODUCT_NAME: CoachingSage
        INFOPLIST_FILE: CoachingSage-Info.plist
        CODE_SIGN_ENTITLEMENTS: CoachingSage.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: SageCore
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Realtime
      - package: Supabase
        product: Storage
      - package: Supabase
        product: Functions
      - package: Templates
        product: TemplateModel
      - package: Templates
        product: TemplateLoader

  CoachingSageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    # Dette SwiftData test_host hang (2026-05-21).
    # ------------------------------------------------------------------------
    # Symptôme historique : depuis iOS 18, `try modelContext.save()` / `fetch()`
    # hang silencieusement quand l'app ET le test bundle déclarent les @Model du
    # même Schema dans le même process. Persiste en iOS 26.4.
    # Cf mémoires `dette_swiftdata_test_host_hang`, `dette_story_310_ac32_*`,
    # `lessons_swiftdata_inmemory_test_hang`.
    #
    # Fix retenu (2026-05-21) : bascule en logic test pur.
    #   - TEST_HOST + BUNDLE_LOADER vidés → pas de chargement du binary app.
    #   - Sources de l'app compilées DANS le module CoachingSageTests (logic).
    #   - Pas de `@testable import CoachingSage` (même module).
    #   - Pas de dépendance vers `target: CoachingSage` (sinon xcodegen
    #     auto-injecte TEST_HOST). Dépendances SPM répliquées explicitement.
    #   - `App/CoachingSageApp.swift` exclu (sinon `@main` duplicate).
    # ------------------------------------------------------------------------
    sources:
      - path: CoachingSageTests
      - path: App
        excludes:
          - "CoachingSageApp.swift"
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Repositories
      - path: Services
      - path: Utilities
      - path: Coaching
      # Resources (Localizable.xcstrings, .lproj, xcassets) inclus pour que
      # `Bundle.main` (= test bundle en logic test) puisse résoudre les clés
      # de localisation dans les unit tests (cf
      # `UniversalQuestionnaireLocalizationTests`).
      - path: Resources
        buildPhase: resources
        excludes:
          - "Brand/_archive-*"
          - "Brand/*.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        INFOPLIST_KEY_SUPABASE_HOST: "test.placeholder.invalid"
        INFOPLIST_KEY_SUPABASE_ANON_KEY: "test-anon-key-placeholder"
    dependencies:
      - package: SageCore
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Realtime
      - package: Supabase
        product: Storage
      - package: Supabase
        product: Functions
      - package: Templates
        product: TemplateModel
      - package: Templates
        product: TemplateLoader
      - package: SnapshotTesting
        product: SnapshotTesting

  CoachingSageUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachingSageUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app.uitests
        TEST_TARGET_NAME: CoachingSage
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CoachingSage

schemes:
  CoachingSage:
    build:
      targets:
        CoachingSage: all
        CoachingSageTests: [test]
        CoachingSageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CoachingSageTests
          parallelizable: false
        - name: CoachingSageUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Nightly CI Xcode Cloud (chantier 1, pattern TailorSageUnitTests) :
  # unit tests + filets contenu Templates, SANS UI tests ni snapshots
  # (références snapshot liées au runtime simu local → faux rouges en cloud).
  CoachingSageUnitTests:
    build:
      targets:
        CoachingSage: all
        CoachingSageTests: [test]
    test:
      config: Debug
      targets:
        - name: CoachingSageTests
          parallelizable: false
          skippedTests:
            - DensityBannerSnapshotTests
            - DryLandGroupingSnapshotTests
            - ExerciseTimelineCardSnapshotTests
            - IllustrationGallerySnapshotTests
            - NewFiguresGallerySnapshotTests
            - OnboardingFilSnapshotTests
            - ProgramCardSnapshotTests
            - ProgrammeFilSnapshotTests
            - RunningComprehensibilitySnapshotTests
            - SpanishExerciseNameSnapshotTests
            - StrengthRepsHeroSnapshotTests
        - package: Templates/TemplateLoaderTests
          parallelizable: false
        - package: Templates/TemplateModelTests
          parallelizable: false

  CoachingSage Staging:
    build:
      targets:
        CoachingSage: all
    run:
      config: Staging
    archive:
      config: Staging

  CoachingSage Release:
    build:
      targets:
        CoachingSage: all
    run:
      config: Release
    archive:
      config: Release
