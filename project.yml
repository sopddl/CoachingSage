name: CoachingSage

options:
  bundleIdPrefix: com.sopddl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.45.0"
  # XcodeGen usage : bootstrap initial uniquement. Après génération,
  # le .xcodeproj est édité via Xcode comme GardenSage/TailorSage.
  # Si project.yml doit évoluer, rerun `xcodegen generate`.

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config-Debug.xcconfig
  Staging: Config-Staging.xcconfig
  Release: Config-Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: QLSTX2JJPF
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SageCore:
    url: https://github.com/sopddl/SageCore.git
    exactVersion: "1.3.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.43.0"

targets:
  CoachingSage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Repositories
      - path: Services
      - path: Utilities
      - path: Resources
        buildPhase: resources
    info:
      path: CoachingSage-Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - fr
          - en
        CFBundleURLTypes:
          - CFBundleURLName: com.sopddl.coachingsage.app
            CFBundleURLSchemes:
              - com.sopddl.coachingsage.app
              - coachingsage
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SUPABASE_HOST: $(SUPABASE_HOST)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: CoachingSage.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.sopddl.coachingsage.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app
        PRODUCT_NAME: CoachingSage
        INFOPLIST_FILE: CoachingSage-Info.plist
        CODE_SIGN_ENTITLEMENTS: CoachingSage.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: SageCore
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Realtime
      - package: Supabase
        product: Storage
      - package: Supabase
        product: Functions

  CoachingSageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachingSageTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CoachingSage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CoachingSage"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CoachingSage

  CoachingSageUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachingSageUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sopddl.coachingsage.app.uitests
        TEST_TARGET_NAME: CoachingSage
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CoachingSage

schemes:
  CoachingSage:
    build:
      targets:
        CoachingSage: all
        CoachingSageTests: [test]
        CoachingSageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CoachingSageTests
        - CoachingSageUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CoachingSage Staging:
    build:
      targets:
        CoachingSage: all
    run:
      config: Staging
    archive:
      config: Staging

  CoachingSage Release:
    build:
      targets:
        CoachingSage: all
    run:
      config: Release
    archive:
      config: Release
