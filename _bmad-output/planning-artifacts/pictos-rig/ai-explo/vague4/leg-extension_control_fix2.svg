<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 64 64" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="-8" width="64" height="64" fill="#ffffff"/>
<!-- machine : dossier vertical derrière le torse -->
<rect x="16.5" y="12" width="2.5" height="18" rx="0.8" fill="#1a1a1a"/>
<!-- machine : assise sous les cuisses -->
<rect x="19" y="29.5" width="16" height="3" rx="0.8" fill="#1a1a1a"/>
<!-- machine : pied au sol -->
<rect x="24" y="32.5" width="3" height="11.5" fill="#1a1a1a"/>
<!-- machine : bras de levier du genou vers le rouleau -->
<path d="M34.5,30.5 L44.5,29.6" stroke="#1a1a1a" stroke-width="2.0" fill="none"/>
<!-- machine : rouleau rembourré contre la cheville -->
<circle cx="45.3" cy="29.2" r="2.2" fill="#1a1a1a"/>
<!-- torse vertical contre le dossier -->
<path d="M23.0,28.0 L21.5,15.0" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
<!-- cuisse horizontale sur l assise -->
<path d="M23.0,28.0 L34.0,28.5" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
<!-- tibia tendu vers l avant-haut (extension) -->
<path d="M34.0,28.5 L45.0,26.6" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
<!-- pied -->
<path d="M45.0,26.6 L48.0,25.8" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
<!-- bras avant : epaule -> coude -> main sur la poignee laterale pres de la hanche -->
<path d="M21.5,15.0 L23.2,21.5" stroke="#c65a37" stroke-width="2.2" fill="none"/>
<path d="M23.2,21.5 L25.8,27.3" stroke="#c65a37" stroke-width="2.2" fill="none"/>
<!-- cou + tete -->
<path d="M21.5,15.0 L21.5,13.2" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
<circle cx="21.4" cy="10.2" r="3.0" fill="#1a1a1a"/>
<line x1="3" y1="44" x2="61" y2="44" stroke="#555555" stroke-width="1.2"/></svg>
